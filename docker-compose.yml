version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootStrongPassword123!
      MYSQL_DATABASE: portfolio_db
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: StrongPassW0rd!@#
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql

  web:
    image: php:8.2-apache
    container_name: portfolio_web
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    networks:
      - frontend
      - backend
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: RootStrongPassword123!
    ports:
      - "8888:80"
    networks:
      - frontend
      - backend
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend
    depends_on:
      - web

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  db_data:
